name: electrical_department
description: "Bravura Electrical Department app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  go_router: ^18.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  flutter_riverpod: ^3.4.3
  animations: ^3.0.0
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  file_picker: ^13.3.0
  pdf: ^3.13.1
  printing: ^5.15.1
  # Job Cards Version 2: dashboard charts, site time zones, date formats.
  fl_chart: ^1.3.0
  intl: ^0.20.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  image_path: assets/branding/icon_bg.png
  android: true
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#FFFFFF"
    theme_color: "#982329"

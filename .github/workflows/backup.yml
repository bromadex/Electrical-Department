name: Database backup

# Every night the live database is dumped, encrypted and kept for 90 days as
# a workflow artifact, then restored into a throwaway database and every
# table's row count and checksum of its values compared, so each backup is
# known to restore (issues #16, #31). A second job copies the uploaded files
# (photos, documents, certificates) to storage you choose; see
# docs/backup-files.md.
#
# Required repo secrets:
#   SUPABASE_DB_URL     the same connection string the Supabase workflow uses
#   BACKUP_PASSPHRASE   a long passphrase; backups are encrypted with it
#                       (gpg, AES-256). Keep it somewhere safe outside GitHub:
#                       without it a backup cannot be opened.
# Optional, for the files:
#   RCLONE_CONFIG       an rclone config with remotes "supabase" (Supabase
#                       Storage over S3) and "files" (an encrypted remote
#                       wherever the copies go); docs/backup-files.md
#
# Restore by hand: download the artifact, then
#   gpg --decrypt backup-<date>.tar.gpg | tar -xz
#   psql "$DB_URL" -f roles.sql; psql "$DB_URL" -f schema.sql
#   psql "$DB_URL" -c "set session_replication_role = replica" \
#     -f auth_storage_data.sql -f data.sql
# Files in Supabase Storage (photos, documents) are not in the database;
# the "files" job below copies them when RCLONE_CONFIG is set.

on:
  schedule:
    - cron: "20 22 * * *" # 00:20 Harare
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.122.0
  # Timestamps print the same on both sides of the checksum comparison.
  PGTZ: UTC

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt and test a restore
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."; exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the BACKUP_PASSPHRASE secret; backups are never kept unencrypted."; exit 1
          fi

      - name: Dump the live database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          # The app's data, and separately the sign-in accounts and storage
          # records (Supabase manages those schemas and can change them).
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy --schema public -f backup/data.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy --schema auth,storage -f backup/auth_storage_data.sql
          ls -la backup

      - name: Count rows in the live database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -At -f scripts/backup_row_counts.sql > live_counts.txt
          cat live_counts.txt

      - name: Restore into a throwaway database
        run: |
          supabase db start
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # The local database already has the schema (the same migrations);
          # load the app's data with triggers off, as a restore would. The
          # auth and storage data is kept but not test-restored: those
          # schemas follow Supabase's versions, not ours.
          psql "$DB" -v ON_ERROR_STOP=1 -q \
            -c "set session_replication_role = replica" \
            -f scripts/backup_truncate.sql \
            -f backup/data.sql
          psql "$DB" -At -f scripts/backup_row_counts.sql > restored_counts.txt

      - name: Compare row counts and checksums
        run: |
          if diff -u live_counts.txt restored_counts.txt; then
            echo "Restore matches the live database, row for row: $(wc -l < live_counts.txt) tables."
          else
            echo "::error::The restored database differs from the live one."; exit 1
          fi

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          day=$(TZ=Africa/Harare date +%F)
          echo "DAY=$day" >> "$GITHUB_ENV"
          tar -C backup -cz . | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 -o "backup-$day.tar.gpg" 3<<< "$BACKUP_PASSPHRASE"
          rm -rf backup
          ls -la "backup-$day.tar.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.DAY }}
          path: backup-${{ env.DAY }}.tar.gpg
          retention-days: 90
          compression-level: 0

  files:
    name: Copy uploaded files
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the files destination is set up
        id: setup
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG_TEXT" ]; then
            echo "::warning::RCLONE_CONFIG is not set, so uploaded files are not backed up. See docs/backup-files.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_TEXT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install rclone
        if: steps.setup.outputs.ready == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone

      - name: Copy new and changed files
        if: steps.setup.outputs.ready == 'true'
        run: |
          # Each bucket is copied into the encrypted "files" remote. Only new
          # or changed files travel; nothing is deleted at the destination,
          # so a file removed by mistake can still be got back.
          for bucket in $(rclone lsf --dirs-only supabase: | tr -d /); do
            echo "== $bucket"
            rclone copy "supabase:$bucket" "files:$bucket" \
              --transfers 8 --checkers 16 --stats-one-line --stats 60s
          done
          rclone size files:

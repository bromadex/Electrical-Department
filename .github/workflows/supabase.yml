name: Supabase database

# Migrations live in supabase/migrations. Every change is checked against a
# throwaway local database; merging to main applies it to the real project.
#
# Required repo secret:
#   SUPABASE_DB_URL  Session pooler connection string, e.g.
#                    postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#                    (URL-encode special characters in the password)
# Optional, for the edge functions in supabase/functions:
#   SUPABASE_ACCESS_TOKEN     repo secret, a personal access token from
#                             supabase.com/dashboard/account/tokens
#   SUPABASE_URL              repo variable (already used by the app workflow)
#   FIREBASE_SERVICE_ACCOUNT  repo secret, the Firebase service account JSON
#                             (needs the Firebase Cloud Messaging Admin role)
#   APP_URL                   repo variable, optional; the web app's address
#                             (browser notifications open jobs there)

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  push:
    branches: ["**"]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4

      - name: Type-check edge functions
        run: deno check supabase/functions/*/index.ts

      - name: Apply migrations to a local database
        run: supabase db start

      - name: Lint schema
        run: supabase db lint --local --level warning --fail-on error

      - name: Run database tests
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          shopt -s nullglob
          for f in supabase/tests/*.sql; do
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: Preview changes for the remote project
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not set; skipping remote preview."
            exit 0
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

  deploy:
    name: Apply migrations to Supabase
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_URL is not set; edge functions not deployed, so no push notifications yet."
            exit 0
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')
          for d in supabase/functions/*/; do
            supabase functions deploy "$(basename "$d")" --project-ref "$ref"
          done

          # Functions removed from the repository are deleted from Supabase too
          # (already gone is fine).
          for f in meeting-record; do
            if [ ! -d "supabase/functions/$f" ]; then
              supabase functions delete "$f" --project-ref "$ref" \
                && echo "Deleted retired function $f" \
                || echo "Retired function $f was already gone"
            fi
          done

          # Push notifications: give push-send its Firebase key, then tell the
          # database where push-send lives (until then the trigger does nothing).
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set; push notifications stay off."
            exit 0
          fi
          supabase secrets set --project-ref "$ref" \
            "FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE_ACCOUNT" \
            "APP_URL=${APP_URL:-https://electrical-department-lake.vercel.app}"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "select public.fn_set_push_endpoint('${SUPABASE_URL%/}/functions/v1/push-send')"
          echo "Push notifications are on."
